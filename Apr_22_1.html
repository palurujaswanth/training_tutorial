<!DOCTYPE html>
<html>
<head>

<title>Dynamic Text Style</title>

</head>
<body>

<div class="container mt-5">
<div id="outputBox" style="margin-top:20px; border:1px solid black; padding:10px;"></div>

    <div>
        <input type="text" id="textInput" class="form-control mb-3" placeholder="Enter text">
        <input type="number" id="fontSize" class="form-control mb-3" placeholder="Enter font size (px)">
        <input type="color" id="colorPicker" class="form-control form-control-color mb-3" placeholder="Back Ground Color">
	<input type="color" id="boxColor"  class="form-control form-control-color mb-3" oninput="applyStyle()">
        <button class="btn btn-primary w-100" onclick="applyStyle()">Apply Style</button>
        <div></div>
    </div>
</div>

<script>
function applyStyle() {
    let text = document.getElementById("textInput").value;
    let size = document.getElementById("fontSize").value;
    let color = document.getElementById("colorPicker").value;
    let boxColor = document.getElementById("colorPicker").value;
    let output = document.getElementById("outputBox");
    output.innerText = text;        
    output.style.fontSize = size + "px"; 
    output.style.backgroundColor = boxColor;
    output.style.color = color;           
}
</script>

</body>
</html>
