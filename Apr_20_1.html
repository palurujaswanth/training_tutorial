<!DOCTYPE html>
<html>
<body>

<input type="text" id="ip" placeholder="Enter number">
<button onclick="test()">Test</button>

<div id="op"></div>

<script>
function test()
{
var n = document.getElementById("ip").value;

var tstart = "<table border='1'><thead><tr><th>S.No</th></tr></thead><tbody>";

var rows = "";

for(let i=1; i<=n; i++)
{
rows += "<tr><td>"+i+"</td></tr>";
}

var tend = "</tbody></table>";

document.getElementById("op").innerHTML = tstart + rows + tend;
}
</script>

</body>
</html>
