<!doctype html>
<html>
<head>
    <title>Array Manipulators</title>
</head>
<body>

<div id="output"></div>

<script>
    let alp = ["A","B","C","D"];

    let display = alp.map(item => {
        return '<li>' + item + '</li>';
    });

    let render = '<ul>' + display.join('') + '</ul>';

    document.getElementById("output").innerHTML = render;
</script>

</body>
</html>
