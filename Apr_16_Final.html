<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body style="background-color: lightyellow;">
<h2 align="center">Registration Form</h2>
<form action="https://www.ibps.in/">
<table border="1" bgcolor="lightblue" bordercolor="black" width="80%" height="600" align="center">
<tr>
<td>UserName</td>
<td><input type="text" placeholder="Username" name="username" autofocus></td>
</tr>
<tr>
<td>Password</td>
<td><input type="password" placeholder="password" name="passwword"></td>
</tr>
<tr>
<td>Email</td>
<td><input type="email" placeholder="E-Mail" name="email"></td>
</tr>
<tr>
<td>Address</td>
<td><textarea name="address"></textarea></td>
</tr>
<tr>
<td>Gender</td>
<td>
<input type="radio" name="gender" val="male">Male
<input type="radio" name="gender" val="Female">Female
</td>
 <tr>
        <td>Courses Interested</td>
        <td>
            <input type="checkbox" name="course" value="DBMS"> DBMS
            <input type="checkbox" name="course" value="DSA"> DSA
            <input type="checkbox" name="course" value="OS"> OS
            <input type="checkbox" name="course" value="FullStack"> Full Stack
        </td>
    </tr>
 <tr>
        <td>Branch</td>
        <td>
            <select name="branch">
                <option>CSE</option>
                <option>ECE</option>
                <option>EEE</option>
                <option>MECH</option>
                <option>CSM</option>
            </select>
        </td>
    </tr>
<tr>
        <td>Date of Birth</td>
        <td><input type="date" name="dob"></td>
    </tr>
    <tr>
        <td>Upload Photo</td>
        <td><input type="file" name="photo"></td>
    </tr>
<td>Skills You Have</td>
        <td>
            <input type="checkbox" name="Skills" value="JAVA"> DBMS
            <input type="checkbox" name="Skills" value="DSA"> DSA
            <input type="checkbox" name="Skills" value="PYTHON"> OS
            <input type="checkbox" name="Skills" value="FullStack"> Full Stack
        </td>
    </tr>
<tr>
        <td colspan="2" align="center">
            <input type="submit" value="Submit">
        </td>
    </tr>
</table>
</form>
