<html>
<head>
<title>CSS Table Example</title>

<style>
table{
border-collapse:collapse;
width:50%;
}

th{
background-color:blue;
color:yellow;
border:1px solid black;
}

td{
background-color:yellow;
color:blue;
border:1px solid black;
}

input{
background-color:yellow;
border:0px solid black;
}

</style>

</head>
<body>

<h1>CSS Table Example</h1>

<table>

<caption>FIRST TABLE</caption>

<tr>
<th>SNO</th>
<th>NAME</th>
<th>AGE</th>
</tr>

<tr>
<td>1</td>
<td><input type="string"></td>
<td>25</td>
</tr>

<tr>
<td>2</td>
<td><input type="string" style="background-color: yellow;border:0px;"; ></td>
<td>35</td>
</tr>

<tr>
<td>3</td>
<td><input type="string"></td>
<td>5</td>
</tr>

</table>

</body>
</html>
